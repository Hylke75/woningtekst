name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  kwaliteit:
    name: Typecheck, lint, unit-tests en build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build (met dummy-configuratie, zonder geheimen)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy_key_000000
          SERVER_RPC_SECRET: ci-dummy-secret-0123456789abcdef0123456789abcdef

  beveiliging:
    name: Dependency- en geheimencontrole
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (productie-afhankelijkheden, hoog en kritiek)
        run: npm audit --omit=dev --audit-level=high
      - name: Geen geheimen of .env-bestanden in de repository
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then echo "Er staat een .env-bestand in git"; exit 1; fi
          if git grep -nE '(sk-ant-[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]{40,})' -- ':!*.md' ':!tests/**'; then echo "Mogelijk geheim gevonden"; exit 1; fi
      - name: Dependency review (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  database:
    name: Database- en RLS-securitytests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:db

  e2e:
    name: Integratie- en E2E-tests (lokale Supabase, AI-mock)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [kwaliteit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # Vaste versie: de uitvoer van `supabase gen types` verschilt per CLI-versie.
          # Bij een update ook `npm run db:types` draaien en het resultaat committen.
          version: 2.120.0
      - name: Supabase starten (migraties worden automatisch toegepast)
        run: supabase start -x studio,realtime,edge-runtime,logflare,vector,imgproxy,supavisor,postgres-meta,mailpit
      - name: Databasetypes actueel (src/lib/database.types.ts)
        run: |
          supabase gen types typescript --local > src/lib/database.types.ts
          if ! git diff --exit-code src/lib/database.types.ts; then
            echo "::error file=src/lib/database.types.ts::Databasetypes wijken af van de migraties. Draai lokaal 'npm run db:types' en commit het resultaat."
            exit 1
          fi
      - name: Fictieve testdata en lokale configuratie
        run: node scripts/local-setup.mjs --schrijf-env
        env:
          SUPABASE_CLI: supabase
      - run: npx vitest run --project integratie
      - run: npx playwright install --with-deps chromium
      - name: Productiebuild met AI-mock
        run: npm run build
      - name: E2E-tests
        run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
